<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="WEIREN men's collection.">
<title>WEIREN | Collection</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{--paper:#f7f7f5;--ink:#111;--line:#d7d7d3;--muted:#666}
.category-page{min-height:100vh;background:var(--paper);color:var(--ink);padding:0 24px 80px}
.category-header{position:sticky;top:0;z-index:50;min-height:68px;background:rgba(247,247,245,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:0 8px}
.category-header .wordmark{justify-self:start;font-size:43px;line-height:.8;letter-spacing:-4px;color:var(--ink);text-decoration:none}
.category-back{justify-self:center;color:var(--ink);text-decoration:none;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.category-actions{justify-self:end;display:flex;align-items:center;gap:2px}.category-actions .icon-button{display:grid}.category-actions .bag-button{position:relative}.category-actions .icon-button svg{width:22px;height:22px}
.category-top{max-width:1500px;margin:auto;padding:55px 0 20px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink)}
.category-kicker{font-size:9px;letter-spacing:.22em;text-transform:uppercase}.category-count{font-size:9px;letter-spacing:.16em}
.category-title-row{max-width:1500px;margin:auto;padding:22px 0 34px;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}.category-title{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(60px,9vw,140px);line-height:.76;letter-spacing:-.07em;margin:0}.category-description{max-width:430px;margin:0;font-size:10px;line-height:1.8;letter-spacing:.12em;color:#333}
.category-tools{max-width:1500px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.17em;text-transform:uppercase}.category-tools-left,.category-tools-right{display:flex;gap:25px;align-items:center}.tool-button{border:0;background:none;padding:0;color:var(--ink);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}.tool-rule{width:35px;height:1px;background:var(--ink)}
.tshirt-list{max-width:1500px;margin:auto;border-top:1px solid var(--line)}.tshirt-section{padding:34px 0 58px;border-bottom:1px solid var(--line)}.tshirt-heading{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}.tshirt-colour{font-family:Georgia,"Times New Roman",serif;font-size:32px;letter-spacing:-.03em;margin:0}.tshirt-index{font-size:8px;letter-spacing:.18em;color:var(--muted)}
.tshirt-frame{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}.tshirt-frame figure{margin:0;background:#fff;min-width:0}.tshirt-frame img{display:block;width:100%;aspect-ratio:1.08/1;object-fit:cover}.tshirt-photo-label{display:flex;justify-content:space-between;padding:10px 12px;font-size:7px;letter-spacing:.16em}
.tshirt-info{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:20px;padding:17px 0 0}.tshirt-name{font-size:9px;letter-spacing:.15em;text-transform:uppercase}.tshirt-price{font-family:Georgia,"Times New Roman",serif;font-size:22px;white-space:nowrap}.tshirt-sizes{display:flex;gap:5px}.tshirt-size{width:38px;height:34px;border:1px solid #bcbcb8;background:transparent;font-size:8px;cursor:pointer}.tshirt-size.selected{background:var(--ink);border-color:var(--ink);color:#fff}.tshirt-add{border:1px solid var(--ink);background:var(--ink);color:#fff;height:34px;padding:0 18px;font-size:8px;letter-spacing:.16em;cursor:pointer}
.other-product{max-width:1500px;margin:auto;padding-top:15px}.other-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:5vw;align-items:start}.other-image{background:#eee}.other-image img{display:block;width:100%;aspect-ratio:1/1.12;object-fit:cover}.other-copy{padding-top:25px}.other-copy .category-kicker{margin-bottom:14px;display:block}.other-copy h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(58px,8vw,120px);line-height:.76;letter-spacing:-.07em;margin:0 0 30px}.other-copy p{font-size:10px;line-height:1.9;letter-spacing:.12em;max-width:430px}.other-price{font-family:Georgia,"Times New Roman",serif;font-size:27px;margin:32px 0}.other-meta{border-top:1px solid var(--ink);padding-top:18px;display:grid;gap:18px}.other-meta label{display:block;font-size:8px;letter-spacing:.2em;margin-bottom:9px}.other-options{display:flex;gap:5px}.other-option{height:36px;min-width:40px;border:1px solid #bbb;background:transparent;font-size:8px;cursor:pointer}.other-option.selected{background:var(--ink);border-color:var(--ink);color:#fff}.other-add{width:100%;height:48px;border:0;background:var(--ink);color:#fff;font-size:9px;letter-spacing:.2em;cursor:pointer;margin-top:5px}
@media(max-width:700px){.category-page{padding:0 12px 55px}.category-header{min-height:55px;padding:0 1px;grid-template-columns:1fr auto 1fr;gap:8px}.category-header .wordmark{font-size:30px;letter-spacing:-3px}.category-back{font-size:6px;letter-spacing:.12em}.category-actions{gap:0}.category-actions .icon-button{width:28px;height:31px}.category-actions .icon-button svg{width:18px;height:18px}.category-actions .bag-button svg{width:19px;height:22px}.category-top{padding:38px 1px 16px}.category-kicker,.category-count{font-size:6.5px;letter-spacing:.15em}.category-title-row{padding:17px 1px 28px;display:block}.category-title{font-size:64px}.category-description{font-size:8px;line-height:1.75;margin-top:18px;max-width:330px}.category-tools{font-size:6.5px;margin-bottom:14px}.category-tools-left,.category-tools-right{gap:12px}.tool-rule{width:22px}.tshirt-section{padding:28px 0 40px}.tshirt-heading{margin-bottom:11px}.tshirt-colour{font-size:26px}.tshirt-index{font-size:6px}.tshirt-frame{gap:1px}.tshirt-frame img{aspect-ratio:.82/1}.tshirt-photo-label{padding:8px 7px;font-size:5.5px}.tshirt-info{grid-template-columns:1fr auto;gap:11px;padding-top:13px}.tshirt-name{font-size:6px}.tshirt-price{font-size:20px;grid-column:1}.tshirt-sizes{grid-column:2;grid-row:1}.tshirt-size{width:31px;height:31px;font-size:7px}.tshirt-add{grid-column:1/-1;width:100%;height:40px;font-size:7px}.other-product{padding-top:8px}.other-grid{grid-template-columns:1fr;gap:20px}.other-copy{padding-top:0}.other-copy h1{font-size:64px;margin-bottom:22px}.other-copy p{font-size:8px}.other-price{font-size:24px;margin:24px 0}.other-meta{padding-top:14px}.other-add{height:44px}}
</style>
</head>
<body>
<header class="category-header"><a class="wordmark" href="index.html" aria-label="Weiren home">WEIREN</a><a class="category-back" href="index.html#collection">COLLECTION</a><div class="category-actions" aria-label="Quick actions"><button class="icon-button" aria-label="Account"><svg viewBox="0 0 32 32"><circle cx="16" cy="9" r="5.5"/><path d="M5.5 27c1.8-6 5.3-9 10.5-9s8.7 3 10.5 9"/></svg></button><button class="icon-button" aria-label="Search"><svg viewBox="0 0 32 32"><circle cx="13.5" cy="13.5" r="8"/><path d="m19.5 19.5 7 7"/></svg></button><button class="icon-button bag-button" aria-label="Shopping bag"><svg viewBox="0 0 32 36"><path d="M7 11h18l1.5 21H5.5L7 11Z"/><path d="M11 11V8a5 5 0 0 1 10 0v3"/></svg><span class="bag-count">0</span></button></div></header>
<main class="category-page"><div class="category-top"><span class="category-kicker">MEN'S COLLECTION</span><span class="category-count" id="category-count">01 / 03</span></div><section id="product-area" aria-live="polite"></section></main>
<script>
const tshirtSections=[{colour:'BLACK',front:'1000004143.png',back:'ChatGPT Image Sep 13, 2026, 05_43_17 PM.png',labels:['WEIREN01','WEIREN06']},{colour:'MAROON',front:'1000004156.png',back:'ChatGPT Image Sep 13, 2026, 06_07_39 PM.png',labels:['WEIREN02','WEIREN10']},{colour:'NAVY',front:'1000004157.png',back:'ChatGPT Image Sep 13, 2026, 06_06_23 PM.png',labels:['WEIREN03','WEIREN09']},{colour:'BROWN',front:'1000004158.png',back:'ChatGPT Image Sep 13, 2026, 05_52_50 PM.png',labels:['WEIREN04','WEIREN07']},{colour:'GREY',front:'1000004159.png',back:'ChatGPT Image Sep 13, 2026, 05_54_13 PM.png',labels:['WEIREN05','WEIREN08']}];
const categories={'t-shirt':{title:'T SHIRT',description:'Acid washed relaxed-fit T-shirt. French Terry, 240 GSM, with a drop shoulder silhouette.',count:'01 / 03',price:499},'jacket':{title:'JACKET',description:'A structured outer layer designed for a refined modern wardrobe.',count:'02 / 03',price:1499,image:'file_00000000849881fa85662703429f1d46.png'},'jeans':{title:'JEANS',description:'A versatile denim essential built around a clean, timeless silhouette.',count:'03 / 03',price:999,image:'file_00000000891c81faa012a266720b48fb.png'}};
const type=new URLSearchParams(location.search).get('type')||'t-shirt';const item=categories[type]||categories['t-shirt'];document.title='WEIREN | '+item.title;document.getElementById('category-count').textContent=item.count;const area=document.getElementById('product-area');
function tshirtSection(s,i){return `<article class="tshirt-section"><div class="tshirt-heading"><h2 class="tshirt-colour">${s.colour}</h2><span class="tshirt-index">${String(i+1).padStart(2,'0')} / 05</span></div><div class="tshirt-frame"><figure><img src="${encodeURI(s.front)}" alt="WEIREN ${s.colour} T shirt front" loading="lazy"><figcaption class="tshirt-photo-label"><span>FRONT</span><span>${s.labels[0]}</span></figcaption></figure><figure><img src="${encodeURI(s.back)}" alt="WEIREN ${s.colour} T shirt back" loading="lazy"><figcaption class="tshirt-photo-label"><span>BACK</span><span>${s.labels[1]}</span></figcaption></figure></div><div class="tshirt-info"><span class="tshirt-name">ACID WASHED RELAXED T-SHIRT</span><span class="tshirt-price">499₹</span><div class="tshirt-sizes"><button class="tshirt-size selected" data-size="M">M</button><button class="tshirt-size" data-size="L">L</button><button class="tshirt-size" data-size="XL">XL</button></div><button class="tshirt-add" data-colour="${s.colour}">ADD TO BAG →</button></div></article>`}
function otherProduct(){return `<section class="other-product"><div class="other-grid"><div class="other-image"><img src="${encodeURI(item.image)}" alt="WEIREN ${item.title.toLowerCase()}"></div><div class="other-copy"><span class="category-kicker">MEN'S COLLECTION</span><h1>${item.title}</h1><p>${item.description}</p><div class="other-price">${item.price}₹</div><div class="other-meta"><div><label>SIZE</label><div class="other-options"><button class="other-option selected">M</button><button class="other-option">L</button><button class="other-option">XL</button></div></div><div><label>COLOUR</label><div class="other-options"><button class="other-option selected">BLACK</button></div></div><button class="other-add" id="other-add">ADD TO BAG →</button></div></div></div></section>`}
if(type==='t-shirt'){area.innerHTML=`<section class="category-title-row"><h1 class="category-title">T SHIRT</h1><p class="category-description">${item.description}</p></section><div class="category-tools"><div class="category-tools-left"><span>05 COLOURS</span><span class="tool-rule"></span><span>MEN</span></div><div class="category-tools-right"><button class="tool-button">FILTER</button><button class="tool-button">SORT</button></div></div><div class="tshirt-list">${tshirtSections.map(tshirtSection).join('')}</div>`;document.querySelectorAll('.tshirt-section').forEach(section=>{section.querySelectorAll('.tshirt-size').forEach(btn=>btn.addEventListener('click',()=>{section.querySelectorAll('.tshirt-size').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')}));section.querySelector('.tshirt-add').addEventListener('click',()=>{const size=section.querySelector('.tshirt-size.selected')?.dataset.size||'M';const color=section.querySelector('.tshirt-add').dataset.colour;if(window.WeirenStore)window.WeirenStore.addToCart({name:`T SHIRT - ${color}`,price:499,size,color})})})}else{area.innerHTML=`<section class="category-title-row"><h1 class="category-title">${item.title}</h1><p class="category-description">${item.description}</p></section><div class="category-tools"><div class="category-tools-left"><span>MEN</span><span class="tool-rule"></span><span>01 STYLE</span></div><div class="category-tools-right"><button class="tool-button">FILTER</button><button class="tool-button">SORT</button></div></div>${otherProduct()}`;document.querySelectorAll('.other-option').forEach(btn=>btn.addEventListener('click',()=>{const group=btn.parentElement;group.querySelectorAll('.other-option').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')}));document.getElementById('other-add').addEventListener('click',()=>{const selected=[...document.querySelectorAll('.other-option.selected')];const size=selected.find(x=>['M','L','XL'].includes(x.textContent))?.textContent||'M';if(window.WeirenStore)window.WeirenStore.addToCart({name:item.title,price:item.price,size,color:'BLACK'})})}
</script><script src="store-ui.js"></script>
</body>
</html>
