<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEIREN | Collection</title>
<link rel="stylesheet" href="styles.css">
<style>
.category-page{min-height:100vh;background:#f7f7f5;color:#111;padding:110px 6vw 60px}.category-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.category-back{color:inherit;text-decoration:none;font-size:11px;letter-spacing:.16em}.category-label{font-size:11px;letter-spacing:.2em}.category-content{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:7vw;align-items:center;max-width:1200px;margin:auto}.category-image{width:100%;max-height:72vh;object-fit:cover;display:block}.category-info h1{font-family:Georgia,serif;font-size:clamp(52px,8vw,120px);font-weight:400;line-height:.85;margin:0 0 20px;letter-spacing:-.06em}.category-info p{font-size:12px;letter-spacing:.15em;line-height:1.8;margin:0 0 30px}.category-rule{display:block;width:100%;height:1px;background:#111;margin-bottom:22px}.category-shop{display:inline-flex;gap:18px;align-items:center;color:inherit;text-decoration:none;font-size:11px;letter-spacing:.16em;cursor:pointer}.category-actions{justify-self:end;display:flex;align-items:center;gap:12px}.category-actions .icon-button{display:grid}.category-actions .bag-button{position:relative}@media(max-width:700px){.category-page{padding:90px 20px 40px}.category-content{grid-template-columns:1fr;gap:35px}.category-image{max-height:none}.category-info h1{font-size:64px}.category-actions{gap:0}.category-actions .icon-button{width:28px;height:31px}.category-actions .icon-button svg{width:19px;height:19px}}
</style>
</head>
<body>
<header class="site-header">
<a class="wordmark" href="index.html" aria-label="Weiren home">WEIREN</a>
<div class="category-actions" aria-label="Quick actions">
<button class="icon-button" aria-label="Account"><svg viewBox="0 0 32 32"><circle cx="16" cy="9" r="5.5"/><path d="M5.5 27c1.8-6 5.3-9 10.5-9s8.7 3 10.5 9"/></svg></button>
<button class="icon-button" aria-label="Search"><svg viewBox="0 0 32 32"><circle cx="13.5" cy="13.5" r="8"/><path d="m19.5 19.5 7 7"/></svg></button>
<button class="icon-button bag-button" aria-label="Shopping bag"><svg viewBox="0 0 32 36"><path d="M7 11h18l1.5 21H5.5L7 11Z"/><path d="M11 11V8a5 5 0 0 1 10 0v3"/></svg><span class="bag-count">0</span></button>
<a class="category-back" href="index.html#collection">BACK TO COLLECTION</a>
</div>
</header>
<main class="category-page">
<div class="category-top"><span class="category-label">MEN'S COLLECTION</span><span class="category-label" id="category-count">01 / 03</span></div>
<section class="category-content" aria-live="polite">
<img class="category-image" id="category-image" src="file_000000001f708211a25a58398aa20b24.png" alt="Weiren T shirt">
<div class="category-info"><p class="category-label" id="category-kicker">EVERYDAY ESSENTIAL</p><h1 id="category-title">T SHIRT</h1><p id="category-description">A clean everyday essential with a relaxed silhouette, made for effortless daily wear.</p><span class="category-rule"></span><a class="category-shop" href="#" id="category-shop">ADD TO BAG <span>→</span></a></div>
</section>
</main>
<script>
const categories={'t-shirt':{title:'T SHIRT',kicker:'EVERYDAY ESSENTIAL',description:'A clean everyday essential with a relaxed silhouette, made for effortless daily wear.',image:'file_000000001f708211a25a58398aa20b24.png',count:'01 / 03',price:499},'jacket':{title:'JACKET',kicker:'BUILT FOR MORE',description:'A structured outer layer designed to bring a refined finish to the modern wardrobe.',image:'file_00000000849881fa85662703429f1d46.png',count:'02 / 03',price:1499},'jeans':{title:'JEANS',kicker:'MADE TO MOVE',description:'A versatile denim essential built around a clean, timeless silhouette.',image:'file_00000000891c81faa012a266720b48fb.png',count:'03 / 03',price:999}};
const type=new URLSearchParams(location.search).get('type')||'t-shirt';const item=categories[type]||categories['t-shirt'];document.title='WEIREN | '+item.title;document.getElementById('category-title').textContent=item.title;document.getElementById('category-kicker').textContent=item.kicker;document.getElementById('category-description').textContent=item.description;document.getElementById('category-count').textContent=item.count;document.getElementById('category-image').src=item.image;document.getElementById('category-image').alt='Weiren '+item.title.toLowerCase();document.getElementById('category-shop').onclick=e=>{e.preventDefault();if(window.WeirenStore)window.WeirenStore.addToCart({name:item.title,price:item.price});};
</script>
<script src="store-ui.js"></script>
</body>
</html>
