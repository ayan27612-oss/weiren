<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="WEIREN men's collection"><title>WEIREN | Collection</title><link rel="stylesheet" href="styles.css">
</head>
<body class="collection-page">
<header class="topbar"><button class="menu-button" aria-label="Open menu" aria-expanded="false"><i></i><i></i></button><a class="brand" href="index.html">WEIREN</a><div class="top-actions"><button class="text-action" aria-label="Account">ACCOUNT</button><button class="icon-action" aria-label="Search">⌕</button><button class="bag-action" aria-label="Shopping bag">BAG <b class="bag-count">0</b></button></div></header>
<main id="category-root"></main>
<div class="menu-overlay" aria-hidden="true"><button class="close-menu" aria-label="Close menu">×</button><div><span>WEIREN / MENU</span><a href="index.html">HOME</a><a href="index.html#shop">COLLECTION</a><a href="category.html?type=t-shirt">T SHIRT</a><a href="category.html?type=jeans">JEANS</a><a href="category.html?type=jacket">JACKET</a></div></div>
<script>
const root=document.getElementById('category-root');
const type=new URLSearchParams(location.search).get('type')||'t-shirt';
const data={
 't-shirt':{title:'T SHIRT',eyebrow:'01 / ESSENTIAL',desc:'Acid washed relaxed-fit T-shirt. French Terry, 240 GSM, drop shoulder silhouette.',price:499,meta:'M / L / XL · FIVE COLOURS',colors:[
  {id:'black',name:'BLACK',front:'1000004143.png',back:'ChatGPT Image Sep 13, 2026, 05_43_17 PM.png'},
  {id:'maroon',name:'MAROON',front:'1000004156.png',back:'ChatGPT Image Sep 13, 2026, 06_07_39 PM.png'},
  {id:'navy',name:'NAVY',front:'1000004157.png',back:'ChatGPT Image Sep 13, 2026, 06_06_23 PM.png'},
  {id:'brown',name:'BROWN',front:'1000004158.png',back:'ChatGPT Image Sep 13, 2026, 05_52_50 PM.png'},
  {id:'grey',name:'GREY',front:'1000004159.png',back:'ChatGPT Image Sep 13, 2026, 05_54_13 PM.png'}
 ]},
 'jeans':{title:'JEANS',eyebrow:'02 / DENIM',desc:'A clean everyday denim essential built around a timeless silhouette.',price:999,meta:'M / L / XL · DENIM',image:'file_00000000891c81faa012a266720b48fb.png'},
 'jacket':{title:'JACKET',eyebrow:'03 / OUTERWEAR',desc:'A structured outer layer designed for a refined modern wardrobe.',price:1499,meta:'M / L / XL · BLACK',image:'file_00000000849881fa85662703429f1d46.png'}
};
const item=data[type]||data['t-shirt'];
const add=(name,price)=>`<button class="add-button" onclick="WeirenStore.addToCart({name:'${name}',price:${price}})">ADD TO BAG <b>→</b></button>`;
function tshirt(){return `<section class="catalog-head section-pad"><div><span class="section-label">${item.eyebrow}</span><h1>${item.title}</h1></div><div><p>${item.desc}</p><span>${item.meta}</span></div></section><div class="catalog-tools"><span>05 COLOURS</span><button onclick="toggleFilters()">FILTER</button><button onclick="document.querySelector('.catalog-grid').classList.toggle('reverse')">SORT</button></div><div class="filter-strip" id="filters"><button class="active" data-filter="all">ALL</button>${item.colors.map(c=>`<button data-filter="${c.id}">${c.name}</button>`).join('')}</div><section class="catalog-grid">${item.colors.map((c,i)=>`<article class="colour-product" id="${c.id}" data-colour="${c.id}"><div class="product-pair"><figure><img src="${c.front}" alt="${c.name} T shirt front"><figcaption>FRONT</figcaption></figure><figure><img src="${c.back}" alt="${c.name} T shirt back"><figcaption>BACK</figcaption></figure></div><div class="product-info"><div><span>${String(i+1).padStart(2,'0')} / ${c.name}</span><h2>ACID WASHED RELAXED T-SHIRT</h2><p>French Terry · 240 GSM · Drop shoulder</p></div><div class="product-buy"><strong>₹${item.price}</strong><div class="sizes"><button>M</button><button>L</button><button>XL</button></div>${add(c.name+' T SHIRT',item.price)}</div></div></article>`).join('')}</section><section class="catalog-note section-pad"><span class="section-label">DETAILS</span><div><h2>MADE FOR<br>REPEAT WEAR.</h2><p>Free shipping across India. Estimated delivery 4–7 days depending on location. COD, UPI and card payment options are planned for the connected checkout.</p></div></section>`}
function single(){return `<section class="single-product section-pad"><div class="single-copy"><span class="section-label">${item.eyebrow}</span><h1>${item.title}</h1><p>${item.desc}</p><strong>₹${item.price}</strong><span>${item.meta}</span><div class="sizes"><button>M</button><button>L</button><button>XL</button></div>${add(item.title,item.price)}<a class="back-link" href="index.html#shop">← BACK TO COLLECTION</a></div><div class="single-image"><img src="${item.image}" alt="WEIREN ${item.title}"></div></section><section class="single-detail section-pad"><span class="section-label">WEIREN / ${item.title}</span><h2>BUILT AROUND<br>THE EVERYDAY.</h2><p>${item.desc} Designed to sit inside the same wardrobe system as the WEIREN T shirt, denim and outerwear.</p></section>`}
root.innerHTML=type==='t-shirt'?tshirt():single();
function toggleFilters(){document.getElementById('filters').classList.toggle('show')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.colour-product').forEach(x=>x.hidden=b.dataset.filter!=='all'&&x.dataset.colour!==b.dataset.filter);});
</script>
<script src="script.js"></script><script src="store-ui.js"></script>
</body></html>
